# ------------------------------------------------------------------- derived quantities
# Ratios and standard errors are functions of the measurements, not measurements. They are
# declared here so that the paper quotes a value with a provenance line instead of typing a
# number: `papertool measure --derive-only` evaluates them over the aggregate means.

[[derive]]
id = "hpp_se32"
group = "derived"
expr = "hpp_size32.mean_net_force.sd / sqrt(hpp_size32.mean_net_force.n)"
unit = "lattice units"
note = "standard error of the mean net force over 20 seeds, size 32"

[[derive]]
id = "hpp_t32"
group = "derived"
expr = "hpp_size32.mean_net_force / hpp_se32.value"
unit = "dimensionless"
note = "mean/SE: how many standard errors the claimed attraction sits from zero, size 32"

[[derive]]
id = "hpp_se48"
group = "derived"
expr = "hpp_size48.mean_net_force.sd / sqrt(hpp_size48.mean_net_force.n)"
unit = "lattice units"
note = "standard error, size 48"

[[derive]]
id = "hpp_t48"
group = "derived"
expr = "hpp_size48.mean_net_force / hpp_se48.value"
unit = "dimensionless"
note = "mean/SE, size 48"

[[derive]]
id = "hpp_se64"
group = "derived"
expr = "hpp_size64.mean_net_force.sd / sqrt(hpp_size64.mean_net_force.n)"
unit = "lattice units"
note = "standard error, size 64 (the README's configuration)"

[[derive]]
id = "hpp_t64"
group = "derived"
expr = "hpp_size64.mean_net_force / hpp_se64.value"
unit = "dimensionless"
note = "mean/SE, size 64"

[[derive]]
id = "hpp_se96"
group = "derived"
expr = "hpp_size96.mean_net_force.sd / sqrt(hpp_size96.mean_net_force.n)"
unit = "lattice units"
note = "standard error, size 96"

[[derive]]
id = "hpp_t96"
group = "derived"
expr = "hpp_size96.mean_net_force / hpp_se96.value"
unit = "dimensionless"
note = "mean/SE, size 96"

[[derive]]
id = "hpp_positive_all"
group = "derived"
expr = "hpp_size32.attraction_detected.true_count + hpp_size48.attraction_detected.true_count + hpp_size64.attraction_detected.true_count + hpp_size96.attraction_detected.true_count"
unit = "runs"
note = "how many of the 80 runs reported a positive net force"

[[derive]]
id = "hpp_all_n"
group = "derived"
expr = "hpp_size32.attraction_detected.n + hpp_size48.attraction_detected.n + hpp_size64.attraction_detected.n + hpp_size96.attraction_detected.n"
unit = "runs"
note = "denominator of hpp_positive_all"

[[derive]]
id = "topo_accept16"
group = "derived"
expr = "topo_size16.accepted_flips / (topo_size16.accepted_flips + topo_size16.rejected_flips)"
unit = "fraction"
note = "acceptance rate of the chi-preserving sampler, size 16"

[[derive]]
id = "topo_accept32"
group = "derived"
expr = "topo_size32.accepted_flips / (topo_size32.accepted_flips + topo_size32.rejected_flips)"
unit = "fraction"
note = "acceptance rate, size 32"

[[derive]]
id = "topo_accept64"
group = "derived"
expr = "topo_size64.accepted_flips / (topo_size64.accepted_flips + topo_size64.rejected_flips)"
unit = "fraction"
note = "acceptance rate, size 64: the freeze the invariant imposes on the dynamics"

[[derive]]
id = "mem_depth_delta_mb"
group = "derived"
expr = "(train_depth48.peak_ws_bytes.mean - train_depth2.peak_ws_bytes.mean) / 1048576"
unit = "MB"
note = "peak working set difference between depth 2 and depth 48: the O(1)-in-depth test"

[[derive]]
id = "mem_batch_delta_mb"
group = "derived"
expr = "(train_batch6400.peak_ws_bytes.mean - train_batch100.peak_ws_bytes.mean) / 1048576"
unit = "MB"
note = "peak working set difference between a 100-sample and a 6400-sample batch: memory is linear in n"

[[derive]]
id = "mem_depth_ratio"
group = "derived"
expr = "train_depth48.peak_ws_bytes.mean / train_depth2.peak_ws_bytes.mean"
unit = "ratio"
note = "24x the depth for this factor of peak memory"

[[derive]]
id = "mem_depth_abs_mb"
group = "derived"
expr = "sqrt((train_depth48.peak_ws_bytes.mean - train_depth2.peak_ws_bytes.mean) * (train_depth48.peak_ws_bytes.mean - train_depth2.peak_ws_bytes.mean)) / 1048576"
unit = "MB"
note = "absolute value of the depth-2 to depth-48 peak difference: the size of the effect, without its sign"
